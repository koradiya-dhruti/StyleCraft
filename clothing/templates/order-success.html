{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="bg0 p-t-100 p-b-100">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="bor10 p-lr-40 p-t-50 p-b-50 p-lr-15-sm txt-center">

                    <div class="p-b-25">
                        <i class="fa fa-check-circle" style="font-size:70px;color:#717fe0;"></i>
                    </div>

                    <h3 class="mtext-109 cl2 p-b-15">Order Placed Successfully!</h3>

                    <p class="stext-111 cl6 p-b-25">
                        Thank you for your order.
                        Your order has been successfully placed.
                    </p>

                    <div class="bor8 p-all-15 m-b-25">
                        <span class="stext-110 cl2">Order Number:</span>
                        <strong id="orderNumber" class="mtext-106 cl2"></strong>
                    </div>

                    <p class="stext-111 cl6 p-b-25">
                        Your order will be delivered within
                        <strong>5 days</strong>.
                    </p>
                    
                    <a href="/"class="flex-c-m stext-101 cl0 size-121 bg3 bor1 hov-btn3 p-lr-15 trans-04 m-t-10">
                        Continue to Home
                    </a>

                </div>
            </div>
        </div>
    </div>
</section>

<script src="{% static 'vendor/jquery/jquery-3.2.1.min.js' %}"></script>

<script>

    $(document).ready(function () {

        let orderNumber = localStorage.getItem("orderNumber");

        if (orderNumber) {
            $("#orderNumber").text(orderNumber);
        } else {
            $("#orderNumber").text("Order confirmed");
        }

    });

</script>

{% endblock content %}
