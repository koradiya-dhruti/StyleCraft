{% load static %}

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        }

        body {
        background-color: #f6f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        }


        /* MAIN CONTAINER */

        .forgot-container {
        background-color: #fff;
        border-radius: 10px;

        box-shadow:
            0 14px 28px rgba(0, 0, 0, 0.25),
            0 10px 10px rgba(0, 0, 0, 0.22);

        width: 768px;
        max-width: 95%;

        min-height: 550px;

        display: flex;
        overflow: hidden;
        }


        /* LEFT SIDE */

        .forgot-left {
        width: 50%;

        background: linear-gradient(
            to right,
            #434343,
            #5b5555
        );

        color: #fff;

        display: flex;
        flex-direction: column;

        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 40px;
        }

        .forgot-left h1 {
        font-size: 28px;
        margin-bottom: 15px;
        }

        .forgot-left p {
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 25px;
        }

        .forgot-left .back-login {
        background-color: transparent;

        color: #fff;

        border: 1px solid #fff;

        padding: 12px 35px;

        border-radius: 20px;

        text-decoration: none;

        font-size: 12px;

        font-weight: bold;

        letter-spacing: 1px;

        text-transform: uppercase;

        transition: 0.2s;
        }

        .forgot-left .back-login:hover {
        background-color: #fff;
        color: #4d4949;
        }


        /* RIGHT SIDE */

        .forgot-right {
        width: 50%;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 40px;
        }


        /* FORM */

        .forgot-form {
        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;
        }

        .forgot-form h1 {
        margin-bottom: 10px;

        font-size: 28px;

        color: #222;
        }

        .forgot-form .description {
        font-size: 12px;

        color: #777;

        text-align: center;

        margin-bottom: 20px;

        line-height: 1.5;
        }


        /* INPUT GROUP */

        .forgot-input-group {
        width: 300px;

        margin: 7px 0;
        }

        .forgot-input-group label {
        display: block;

        font-size: 12px;

        margin-bottom: 5px;

        color: #555;

        text-align: left;
        }

        .forgot-input-group input {
        background-color: #eee;

        border: none;

        padding: 12px 15px;

        width: 100%;

        border-radius: 5px;

        outline: none;

        font-size: 13px;
        }

        .forgot-input-group input:focus {
        box-shadow: 0 0 0 1px #555;
        }


        /* BUTTON */

        .forgot-button {
        background-color: #4d4949;

        color: #fff;

        font-size: 12px;

        font-weight: bold;

        padding: 12px 45px;

        letter-spacing: 1px;

        text-transform: uppercase;

        border-radius: 20px;

        border: 1px solid #111;

        cursor: pointer;

        margin-top: 15px;

        transition: transform 80ms ease;
        }

        .forgot-button:active {
        transform: scale(0.95);
        }

        .forgot-button:hover {
        background-color: #333;
        }


        /* OTP AND PASSWORD SECTIONS */

        #otpSection,
        #passwordSection {
        width: 100%;
        }


        /* MESSAGE */

        #forgotMessage {
        font-size: 13px;

        margin-top: 15px;

        text-align: center;

        min-height: 20px;
        }

        .success-message {
        color: green;
        }

        .error-message {
        color: red;
        }


        /* HIDE PASSWORD SECTION INITIALLY */

        #otpSection,
        #passwordSection {
        display: none;
        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

        .forgot-container {
            flex-direction: column;

            min-height: auto;
        }

        .forgot-left,
        .forgot-right {
            width: 100%;
        }

        .forgot-left {
            padding: 35px 25px;
        }

        .forgot-right {
            padding: 35px 25px;
        }

        }
</style>

<div class="forgot-container">


    <!-- LEFT SIDE -->

    <div class="forgot-left">

        <h1>Welcome Back!</h1>

        <p>
            Don't worry if you forgot your password.
            Reset your password using your registered
            email address and OTP.
        </p>

        <a
            href="/register"
            class="back-login"
        >
            Back to Login
        </a>

    </div>


    <!-- RIGHT SIDE -->

    <div class="forgot-right">

        <form
            class="forgot-form"
            id="forgotPasswordForm"
        >

            {% csrf_token %}


            <h1>Forgot Password?</h1>

            <p class="description">
                Enter your registered email address
                to receive an OTP.
            </p>


            <!-- EMAIL -->
            <div id="emailSection">
                <div class="forgot-input-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- GET OTP -->

                <button
                    type="button"
                    class="forgot-button"
                    id="getOtpButton"
                >
                    Get OTP
                </button>
            </div>


            <!-- OTP SECTION -->

            <div id="otpSection">

                <div class="forgot-input-group">

                    <label for="forgotOtp">
                        Enter OTP
                    </label>

                    <input
                        type="text"
                        id="forgotOtp"
                        maxlength="6"
                        placeholder="Enter 6 digit OTP"
                    >

                </div>


                <button
                    type="button"
                    class="forgot-button"
                    id="verifyOtpButton"
                >
                    Submit OTP
                </button>

            </div>


            <!-- PASSWORD SECTION -->

            <div id="passwordSection">

                <div class="forgot-input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                    >

                </div>


                <div class="forgot-input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                    >

                </div>


                <button
                    type="button"
                    class="forgot-button"
                    id="resetPasswordButton"
                >
                    Submit
                </button>

            </div>


            <!-- MESSAGE -->

            <p id="forgotMessage"></p>

        </form>

    </div>

</div>


<!-- jQuery -->

<script src="{% static 'vendor/jquery/jquery-3.2.1.min.js' %}">
</script>


<script>

    $(document).ready(function () {


        // ================================
        // GET OTP
        // ================================

        $("#getOtpButton").click(function () {

            let email = $("#forgotEmail").val().trim();


            if (!email) {

                $("#forgotMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text("Please enter your email address.");

                return;
            }


            $.ajax({

                url: "/forgotPassword/",

                type: "POST",

                data: {

                    action: "getOtp",

                    email: email,

                    csrfmiddlewaretoken:
                        $("#forgotPasswordForm input[name='csrfmiddlewaretoken']").val()

                },


                success: function (response) {

                    $("#forgotMessage")
                        .removeClass("error-message")
                        .addClass("success-message")
                        .text(response.message);


                    // Show OTP section
                    $("#emailSection").hide();
                    $("#otpSection").show();


                    // Clear previous OTP

                    $("#forgotOtp").val("");

                },


                error: function (xhr) {

                    let message = "Unable to send OTP.";

                    if (xhr.responseJSON) {

                        if (xhr.responseJSON.message) {

                            message = xhr.responseJSON.message;

                        } else if (xhr.responseJSON.error) {

                            message = xhr.responseJSON.error;

                        }

                    }


                    $("#forgotMessage")
                        .removeClass("success-message")
                        .addClass("error-message")
                        .text(message);

                }

            });

        });


        // ================================
        // VERIFY OTP
        // ================================

        $("#verifyOtpButton").click(function () {

            let email = $("#forgotEmail").val().trim();

            let otp = $("#forgotOtp").val().trim();


            if (!otp) {

                $("#forgotMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text("Please enter OTP.");

                return;
            }


            $.ajax({

                url: "/forgotPassword/",

                type: "POST",

                data: {

                    action: "verifyOtp",

                    email: email,

                    otp: otp,

                    csrfmiddlewaretoken:
                        $("#forgotPasswordForm input[name='csrfmiddlewaretoken']").val()

                },


                success: function (response) {

                    $("#forgotMessage")
                        .removeClass("error-message")
                        .addClass("success-message")
                        .text(response.message);


                    // Show password section
                    $("#emailSection").hide();
                    $("#otpSection").hide();
                    $("#passwordSection").show();


                    // Disable OTP fields

                    $("#forgotOtp").prop(
                        "disabled",
                        true
                    );

                    $("#verifyOtpButton").prop(
                        "disabled",
                        true
                    );

                },


                error: function (xhr) {

                    let message = "OTP verification failed.";

                    if (xhr.responseJSON) {

                        if (xhr.responseJSON.message) {

                            message = xhr.responseJSON.message;

                        } else if (xhr.responseJSON.error) {

                            message = xhr.responseJSON.error;

                        }

                    }


                    $("#forgotMessage")
                        .removeClass("success-message")
                        .addClass("error-message")
                        .text(message);

                }

            });

        });


        // ================================
        // RESET PASSWORD
        // ================================

        $("#resetPasswordButton").click(function () {

            let email = $("#forgotEmail").val().trim();

            let newPassword =
                $("#newPassword").val();

            let confirmPassword =
                $("#confirmPassword").val();


            if (!newPassword) {

                $("#forgotMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text("Please enter new password.");

                return;
            }


            if (!confirmPassword) {

                $("#forgotMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text("Please enter confirm password.");

                return;
            }


            if (newPassword !== confirmPassword) {

                $("#forgotMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text(
                        "Password and confirm password do not match."
                    );

                return;
            }


            $.ajax({

                url: "/forgotPassword/",

                type: "POST",

                data: {

                    action: "resetPassword",

                    email: email,

                    newPassword: newPassword,

                    confirmPassword: confirmPassword,

                    csrfmiddlewaretoken:
                        $("#forgotPasswordForm input[name='csrfmiddlewaretoken']").val()

                },


                success: function (response) {

                    $("#forgotMessage")
                        .removeClass("error-message")
                        .addClass("success-message")
                        .text(response.message);


                    // Save token

                    localStorage.setItem(
                        "token",
                        response.token
                    );


                    // Redirect

                    setTimeout(function () {

                        window.location.href = "/";

                    }, 1000);

                },


                error: function (xhr) {

                    let message = "Password reset failed.";

                    if (xhr.responseJSON) {

                        if (xhr.responseJSON.message) {

                            message = xhr.responseJSON.message;

                        } else if (xhr.responseJSON.error) {

                            message = xhr.responseJSON.error;

                        }

                    }


                    $("#forgotMessage")
                        .removeClass("success-message")
                        .addClass("error-message")
                        .text(message);

                }

            });

        });

    });

</script>
