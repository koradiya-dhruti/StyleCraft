	<script>

		$(document).ready(function () {
			headerSetActiveMenu();
			headerGetCart();
			headerGetWishlistCount();
			headerGetCartCount();
		});

		function headerSetActiveMenu() {

			let currentPath = window.location.pathname;

			// Remove active class first
			$(".main-menu li").removeClass("active-menu");
			$(".main-menu-m li").removeClass("active-menu");

			// Remove trailing slash
			if (
				currentPath.length > 1 &&
				currentPath.endsWith("/")
			) {
				currentPath = currentPath.slice(0, -1);
			}

			// HOME
			if (
				currentPath === "" ||
				currentPath === "/"
			) {
				$('a[href="/"]').closest("li").addClass("active-menu");
			}

			// SHOP
			else if (
				currentPath === "/product" ||
				currentPath.indexOf("/product-detail") === 0
			) {
				$('a[href="/product"]').closest("li").addClass("active-menu");
			}

			// CART
			else if (
				currentPath === "/shoping-cart"
			) {
				$('a[href="/shoping-cart"]').closest("li").addClass("active-menu");
			}

			// ABOUT
			else if (
				currentPath === "/about"
			) {
				$('a[href="/about"]').closest("li").addClass("active-menu");
			}

			// CONTACT
			else if (
				currentPath === "/contact"
			) {
				$('a[href="/contact"]').closest("li").addClass("active-menu");
			}
		}

		function headerGetCartCount() {
			let token = localStorage.getItem("token");

			if (!token) {
				$("#cartHeader").attr("data-notify", "0");
				return;
			}

			$.ajax({

				url: "/getCart/",
				type: "GET",
				headers: {
					"Authorization": token
				},

				success: function (response) {

					let cartItems = response.cartItem || [];
					let count = 0;

					for (let i = 0; i < cartItems.length; i++) {
						count += parseInt(cartItems[i].quantity) || 0;
					}
					$("#cartHeader").attr("data-notify",count);
				},

				error: function () {
					$("#cartHeader").attr("data-notify","0");
				}
			});
		}

		function headerGetWishlistCount() {
			let token = localStorage.getItem("token");

			if (!token) {
				$("#wishlistHeader").attr("data-notify","0");
				return;
			}

			$.ajax({
				url: "/getWishlist/",
				type: "GET",
				headers: {
					"Authorization": token
				},

				success: function (response) {
					let count = response.count || 0;
					$("#wishlistHeader").attr("data-notify", count);
				},

				error: function () {
					$("#wishlistHeader").attr("data-notify","0");
				}
			});
		}

		function headerGetToken() {
			return localStorage.getItem("token");
		}


		function headerGetCart() {
			let token = headerGetToken();

			// Not logged in
			if (!token) {
				headerShowEmptyCart();
				return;
			}

			$.ajax({
				url: "/getCart/",
				type: "GET",
				headers: {
					"Authorization": token,
					"X-CSRFToken":"{{ csrf_token }}"
				},

				success: function (response) {
					let cartItems = response.cartItem || [];

					$("#headerCartItems").empty();

					if (
						cartItems.length === 0
					) {
						headerShowEmptyCart();
						return;
					}

					let subtotal = 0;

					for (let i = 0; i < cartItems.length; i++) {

						let item = cartItems[i];
						let price = parseFloat(item.price) || 0;
						let quantity = parseInt(item.quantity) || 1;
						let total = parseFloat(item.total) || (price * quantity);

						subtotal += total;

						let image = item.image || "";
						let productName = item.productName || "";
						let color = item.color || "";
						let size = item.size || "";

						let row = `
							<li class="header-cart-item flex-w flex-t m-b-12">
								<div class="header-cart-item-img">
									<img src="${image}" alt="${productName}">
								</div>

								<div class="header-cart-item-txt p-t-8">
									<a href="/product-detail/${item.productId || ''}" class="header-cart-item-name m-b-1 hov-cl1 trans-04">
										${productName}
									</a>

									<span class="header-cart-item-info">
										${color ? "Color : " + color : ""}
										${color && size ? " | " : ""}
										${size ? "Size : " + size : ""}
									</span>

									<span class="header-cart-item-info">
										₹${price.toFixed(2)}&nbsp; x &nbsp;${quantity}
									</span>
								</div>
							</li>`;

						$("#headerCartItems").append(row);
					}
					$("#headerCartTotal").text("Total: ₹" + subtotal.toFixed(2));
				},

				error: function (xhr) {
					console.log("Header Cart Error:", xhr.responseText);
					headerShowEmptyCart();
				}
			});
		}

		function headerShowEmptyCart() {
			$("#headerCartItems").html(`
					<li class="text-center p-t-30 p-b-30 w-full">
						<span class="stext-102 cl6">
							Your cart is empty.
						</span>
					</li>
				`);
			$("#headerCartTotal").text("Total: ₹0.00");
		}

		$(document).on("click", ".js-show-cart", function () {
				// Get latest cart data
				headerGetCart();
			}
		);
	</script>
