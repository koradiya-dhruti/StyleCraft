{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container">
    <div class="bread-crumb flex-w p-l-25 p-r-15 p-t-30 p-lr-0-lg">
        <a href="/" class="stext-109 cl8 hov-cl1 trans-04">
            Home
            <i class="fa fa-angle-right m-l-9 m-r-10" aria-hidden="true"></i>
        </a>

        <span class="stext-109 cl4">
            Shopping Cart
        </span>
    </div>
</div>

<form class="bg0 p-t-40 p-b-85">

    <!-- CART CONTENT -->
    <div id="cartContent">

        <div class="container-fluid">
            <div class="row">

                <!-- LEFT SIDE -->
                <div class="col-lg-8 col-xl-7 m-lr-auto m-b-50">

                    <div class="m-l-25 m-r--38 m-lr-0-xl">

                        <div class="wrap-table-shopping-cart">

                            <table class="table">

                                <thead>
                                    <tr>
                                        <th scope="col"></th>
                                        <th scope="col">Product</th>
                                        <th scope="col">Price</th>
                                        <th scope="col">Quantity</th>
                                        <th scope="col">Total</th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>

                                <tbody
                                    class="table-group-divider"
                                    id="cartItems">
                                </tbody>

                            </table>

                        </div>


                        <!-- REMOVE CART -->
                        <div
                            id="cartBottom"
                            class="flex-w flex-sb-m bor15 p-t-18 p-b-15 p-lr-40 p-lr-15-sm"
                            style="display:none;">

                            <div class="flex-w flex-m m-r-20 m-tb-5">

                                <button
                                    type="button"
                                    id="removeCartBtn"
                                    class="flex-c-m stext-101 cl0 size-118 bg3 bor13 hov-btn3 p-lr-15 trans-04 m-tb-5">

                                    Remove Cart

                                </button>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- RIGHT SIDE CART TOTALS -->
                <div
                    id="cartTotalsBox"
                    class="col-sm-10 col-lg-7 col-xl-5 m-lr-auto m-b-50">

                    <div class="bor10 p-lr-40 p-t-30 p-b-40 m-l-63 m-r-0 m-lr-0-xl p-lr-15-sm">

                        <h4 class="mtext-109 cl2 p-b-30">
                            Cart Totals
                        </h4>


                        <!-- SUBTOTAL -->
                        <div class="flex-w flex-t bor12 p-b-13">

                            <div class="size-208">
                                <span class="stext-110 cl2">
                                    Subtotal:
                                </span>
                            </div>

                            <div class="size-209">

                                <span
                                    id="subtotal"
                                    class="mtext-110 cl2">
                                    ₹0
                                </span>

                            </div>

                        </div>


                        <!-- SHIPPING -->
                        <div class="flex-w flex-t bor12 p-t-15 p-b-30">

                            <div class="size-208 w-full-ssm">

                                <span class="stext-110 cl2">
                                    Shipping:
                                </span>

                            </div>

                            <div class="size-209 p-r-18 p-r-0-sm w-full-ssm">

                                <p class="stext-111 cl6 p-t-2">
                                    Shipping will be calculated during checkout.
                                </p>

                            </div>

                        </div>


                        <!-- TOTAL -->
                        <div class="flex-w flex-t p-t-27 p-b-33">

                            <div class="size-208">

                                <span class="mtext-101 cl2">
                                    Total:
                                </span>

                            </div>

                            <div class="size-209 p-t-1">

                                <span
                                    id="cartTotal"
                                    class="mtext-110 cl2">
                                    ₹0
                                </span>

                            </div>

                        </div>


                        <!-- CHECKOUT -->
                        <a
                            href="/checkout/"
                            id="checkoutBtn"
                            class="flex-c-m stext-101 cl0 size-116 bg3 bor14 hov-btn3 p-lr-15 trans-04 pointer">

                            Proceed to Checkout

                        </a>

                    </div>

                </div>

            </div>
        </div>

    </div>


    <!-- EMPTY CART -->
    <div
        id="emptyCart"
        style="display:none; text-align:center; padding:80px 20px;">

        <h4 class="mtext-105 cl2 p-b-20">
            Your cart is empty
        </h4>

        <a href="/product/"
        class="flex-c-m stext-101 cl0 bg3 bor13 hov-btn3 p-lr-15 trans-04"
        style="width: 280px; height: 45px; margin: auto;">

            Continue Shopping

        </a>

    </div>

</form>

<script src="{% static 'vendor/jquery/jquery-3.2.1.min.js' %}"></script>

<script>

    $(document).ready(function(){
        getCart();
    });

    function getToken(){
        return localStorage.getItem("token");
    }

    function getCart(){

        let token = getToken();

        if(!token){
            showEmptyCart();
            return;
        }

        $.ajax({
            url:"/getCart/",
            type:"GET",
            headers:{
                "Authorization":token,
                'X-CSRFToken': '{{ csrf_token }}',
            },

            success:function(response){

                $("#cartItems").empty();

                let cartItems = response.cartItem || [];

                if(cartItems.length === 0){
                    showEmptyCart();
                    return;
                }

                let subtotal = 0;
                $.each(cartItems,function(index,item){
                    let total = parseFloat(item.total) || 0;
                    let price = parseFloat(item.price) || 0;
                    let quantity = parseInt(item.quantity) || 1;
                    subtotal += total;
                    
                    let row = `
                        <tr id="cart-row-${item.cartItemId}">
                            <td>
                                <div class="how-itemcart1">
                                    <img src="${item.image}" alt="IMG">
                                </div>
                            </td>
                            <td>
                                ${item.productName}
                                <div class="stext-111 cl6 m-t-5">
                                    ${item.color ? "Color : " + item.color : ""}
                                    ${item.size ? " | Size : " + item.size : ""}
                                </div>
                            </td>
                            <td>
                                ₹${price.toFixed(2)}
                            </td>
                            <td>
                                <div class="wrap-num-product flex-w">
                                    <button type="button" class="btn-num-product-down cl8 hov-btn3 trans-04 flex-c-m" onclick="minusQuantity(${item.cartItemId})">
                                        <i class="fs-16 zmdi zmdi-minus"></i>
                                    </button>
                                    <input class="mtext-104 cl3 txt-center num-product" type="number" value="${quantity}" min="1" onchange="manualQuantity(${item.cartItemId},this.value)">
                                    <button type="button" class="btn-num-product-up cl8 hov-btn3 trans-04 flex-c-m" onclick="plusQuantity(${item.cartItemId})">
                                        <i class="fs-16 zmdi zmdi-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td>
                                ₹${total.toFixed(2)}
                            </td>
                            <td>
                                <button type="button" class="flex-c-m stext-101 cl0 size-116 bg3 bor14 hov-btn3 p-lr-15 pointer" onclick="removeCartItem(${item.cartItemId})">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;

                    $("#cartItems").append(row);

                });

                $("#subtotal").text("₹" + subtotal.toFixed(2));

                $("#cartTotal").text("₹" + subtotal.toFixed(2));

                $("#cartBottom").show();

                $("#cartContent").show();

                $("#emptyCart").hide();
            },

            error:function(xhr){
                console.log(xhr.responseText);
                showEmptyCart();
            }
        });
    }

    function getSingleCartItem(cartItemId,callback){

        let token = getToken();

        $.ajax({

            url:"/getSingleCartItem/?id=" + cartItemId,
            type:"GET",
            headers:{
                "Authorization": token,
                'X-CSRFToken': '{{ csrf_token }}',
            },

            success:function(response){

                if(response.cartItem){
                    callback(response.cartItem);
                }else{
                    alert("Cart item not found.");
                }
            },

            error:function(xhr){
                console.log(xhr.responseText);
                alert("Unable to get cart item.");
            }
        });
    }

    function updateCartItem(cartItemId,quantity){

        let token = getToken();

        quantity = parseInt(quantity);
        if(isNaN(quantity) || quantity < 1){
            getCart();
            return;
        }

        $.ajax({

            url:"/updateCartItem/?id=" + cartItemId,
            type:"PUT",
            headers:{
                "Authorization": token,
                'X-CSRFToken': '{{ csrf_token }}',
            },

            data:({
                quantity:quantity
            }),

            success:function(response){
                getCart();
            },

            error:function(xhr){
                let message = "Unable to update cart item.";
                if(xhr.responseJSON && (xhr.responseJSON.message || xhr.responseJSON.error)){
                    message = xhr.responseJSON.message || xhr.responseJSON.error;
                }
                alert(message);
                getCart();
            }
        });
    }

    function plusQuantity(cartItemId){
        getSingleCartItem(cartItemId,function(item){
            let quantity = parseInt(item.quantity) + 1;
            updateCartItem(cartItemId,quantity);
        });
    }

    function minusQuantity(cartItemId){
        getSingleCartItem(cartItemId,function(item){
            let quantity = parseInt(item.quantity) - 1;
            if(quantity <= 0){
                //removeCartItem(cartItemId);
                //return;
            }
            updateCartItem(cartItemId,quantity);
        });
    }

    function manualQuantity(cartItemId,quantity){
        quantity = parseInt(quantity);
        if(isNaN(quantity) || quantity < 1){
            getCart();
            return;
        }
        updateCartItem(cartItemId,quantity);
    }

    function removeCartItem(cartItemId){

        let token = getToken();

        $.ajax({

            url:"/removeCartItem/?id=" + cartItemId,
            type:"DELETE",
            headers:{
                "Authorization": token,
                'X-CSRFToken': '{{ csrf_token }}',
            },

            success:function(response){
                getCart();
            },

            error:function(xhr){
                console.log(xhr.responseText);
                alert("Unable to remove cart item.");
            }
        });
    }
    
    $("#removeCartBtn").on("click",function(){

        let token = getToken();

        if(!token){
            showEmptyCart();
            return;
        }
        if(!confirm("Are you sure you want to remove all cart items?")){
            return;
        }

        $.ajax({

            url:"/removeCart/",
            type:"DELETE",
            headers:{
                "Authorization": token,
                'X-CSRFToken': '{{ csrf_token }}',
            },

            success:function(response){
                showEmptyCart();
            },

            error:function(xhr){
                console.log(xhr.responseText);
                alert("Unable to remove cart.");
            }
        });
    });

    function showEmptyCart(){

        $("#cartContent").hide();

        $("#emptyCart").show();

        $("#cartItems").empty();

        $("#subtotal").text("₹0");

        $("#cartTotal").text("₹0");

    }
</script>
{% endblock content %}
