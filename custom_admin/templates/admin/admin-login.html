{% load static %}
<!DOCTYPE html>

<html
  lang="en"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="../assets/"
  data-template="vertical-menu-template-free"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>Login | StyleCraft</title>

    <meta name="description" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static "admin/assets/img/favicon/favicon.ico" %}" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet" />

    <!-- Icons. Uncomment required icon fonts -->
    <link rel="stylesheet" href="{% static "admin/assets/vendor/fonts/boxicons.css" %}" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="{% static "admin/assets/vendor/css/core.css" %}" class="template-customizer-core-css" />
    <link rel="stylesheet" href="{% static "admin/assets/vendor/css/theme-default.css" %}" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="{% static "admin/assets/css/demo.css" %}" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" href="{% static "admin/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" %}" />

    <link rel="stylesheet" href="{% static "admin/assets/vendor/libs/apex-charts/apex-charts.css" %}" />

    <!-- Page CSS -->

    <!-- Helpers -->
    <script src="{% static "admin/assets/vendor/js/helpers.js" %}"></script>

    <!--! Template customizer & Theme config files MUST be included after core stylesheets and helpers.js in the <head> section -->
    <!--? Config:  Mandatory theme config file contain global vars & default theme options, Set your preferred theme option in this file.  -->
    <script src="{% static "admin/assets/js/config.js" %}"></script>
  </head>

  <body>
    <!-- Content -->

    <div class="container-xxl">
        <div class="authentication-wrapper authentication-basic container-p-y">
            <div class="authentication-inner col-12 col-sm-10 col-md-6 col-lg-4 mx-auto">

                <div class="card">
                    <div class="card-body">

                        <div class="app-brand justify-content-center mb-4">
                            <a href="#" class="app-brand-link gap-2">
                                <span class="app-brand-logo demo">
                                    <!-- Keep your existing Sneat logo here -->
                                </span>
                                <span class="app-brand-text demo text-body fw-bolder">
                                    StyleCraft
                                </span>
                            </a>
                        </div>

                        <h4 class="mb-2">Welcome to StyleCraft! 👋</h4>
                        <p class="mb-4">
                            Please sign-in to your account
                        </p>

                        <div id="loginMessage" class="alert d-none" role="alert"></div>

                        <form id="formAuthentication">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your admin email"
                                    autocomplete="username"
                                    required
                                    autofocus
                                />
                            </div>

                            <div class="mb-3 form-password-toggle">
                                <div class="d-flex justify-content-between">
                                    <label for="password" class="form-label">Password</label>
                                    <a href="{% url 'custom_admin:adminForgotPassword' %}">
                                        <small>Forgot Password?</small>
                                    </a>
                                </div>

                                <div class="input-group input-group-merge">
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Enter your password"
                                        autocomplete="current-password"
                                        required
                                    />
                                    <span
                                        class="input-group-text cursor-pointer"
                                        id="togglePassword"
                                    >
                                        <i class="bx bx-hide"></i>
                                    </span>
                                </div>
                            </div>

                            <button
                                type="submit"
                                id="loginButton"
                                class="btn btn-primary d-grid w-100"
                            >
                                Sign in
                            </button>
                        </form>


                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- / Content -->

    <!-- Core JS -->
    <!-- build:js assets/vendor/js/core.js -->
    <script src="{% static "admin/assets/vendor/libs/jquery/jquery.js" %}"></script>
    <script src="{% static "admin/assets/vendor/libs/popper/popper.js" %}"></script>
    <script src="{% static "admin/assets/vendor/js/bootstrap.js" %}"></script>
    <script src="{% static "admin/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js" %}"></script>

    <script src="{% static "admin/assets/vendor/js/menu.js" %}"></script>
    <!-- endbuild -->

    <!-- Vendors JS -->

    <!-- Main JS -->
    <script src="{% static "admin/assets/js/main.js" %}"></script>

    <!-- Page JS -->

    <!-- Place this tag in your head or just before your close body tag. -->
    <script async defer src="https://buttons.github.io/buttons.js"></script>
    
    <script>
        $(document).ready(function () {

            // If a token already exists, verify it before skipping login.
            $("#formAuthentication").on("submit", function (event) {
                event.preventDefault();

                $("#loginButton").prop("disabled", true);

                $.ajax({
                    url: "{% url 'custom_admin:adminLoginApi' %}",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        email: $("#email").val().trim(),
                        password: $("#password").val()
                    }),
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    
                    success: function (response) {
                        if (
                            response.status === "success" &&
                            response.token
                        ) {
                            localStorage.setItem("token", response.token);

                            window.location.replace(
                                "{% url 'custom_admin:adminIndex' %}"
                            );
                        } else {
                            alert(response.message || "Login failed.");
                        }
                    },
                    error: function (xhr) {
                        alert(
                            xhr.responseJSON?.message ||
                            "Login failed. Please try again."
                        );
                    },
                    complete: function () {
                        $("#loginButton").prop("disabled", false);
                    }
                });
            });
        });
    </script>

  </body>
</html>
